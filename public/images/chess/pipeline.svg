<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" font-family="system-ui, -apple-system, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="13"><text x="360" y="26" font-size="15" fill="var(--ink,#1a202c)" text-anchor="middle" font-weight="700">How a change reaches the engine</text><rect x="20" y="70" width="120" height="86" rx="8" fill="currentColor" fill-opacity="0.05" stroke="#3f73c4" stroke-width="1.5"/><text x="80.0" y="98" font-size="13" fill="var(--ink,#1a202c)" text-anchor="middle" font-weight="700">a change</text><text x="80.0" y="122" font-size="11" fill="var(--ink-soft,#5a6677)" text-anchor="middle" font-weight="400">one switch in</text><text x="80.0" y="138" font-size="11" fill="var(--ink-soft,#5a6677)" text-anchor="middle" font-weight="400">SearchOptions</text><line x1="140" y1="113" x2="160" y2="113" stroke="var(--ink-soft,#5a6677)" stroke-width="1.6"/><path d="M160 113 L152.8 116.5 L152.8 109.5 Z" fill="var(--ink-soft,#5a6677)"/><rect x="160" y="70" width="120" height="86" rx="8" fill="currentColor" fill-opacity="0.05" stroke="#3f73c4" stroke-width="1.5"/><text x="220.0" y="98" font-size="13" fill="var(--ink,#1a202c)" text-anchor="middle" font-weight="700">1,404 puzzles</text><text x="220.0" y="122" font-size="11" fill="var(--ink-soft,#5a6677)" text-anchor="middle" font-weight="400">every mate</text><text x="220.0" y="138" font-size="11" fill="var(--ink-soft,#5a6677)" text-anchor="middle" font-weight="400">must be found</text><line x1="280" y1="113" x2="300" y2="113" stroke="var(--ink-soft,#5a6677)" stroke-width="1.6"/><path d="M300 113 L292.8 116.5 L292.8 109.5 Z" fill="var(--ink-soft,#5a6677)"/><rect x="300" y="70" width="120" height="86" rx="8" fill="currentColor" fill-opacity="0.05" stroke="#3f73c4" stroke-width="1.5"/><text x="360.0" y="98" font-size="13" fill="var(--ink,#1a202c)" text-anchor="middle" font-weight="700">nodes</text><text x="360.0" y="122" font-size="11" fill="var(--ink-soft,#5a6677)" text-anchor="middle" font-weight="400">same depth,</text><text x="360.0" y="138" font-size="11" fill="var(--ink-soft,#5a6677)" text-anchor="middle" font-weight="400">15 positions</text><line x1="420" y1="113" x2="440" y2="113" stroke="var(--ink-soft,#5a6677)" stroke-width="1.6"/><path d="M440 113 L432.8 116.5 L432.8 109.5 Z" fill="var(--ink-soft,#5a6677)"/><rect x="440" y="70" width="120" height="86" rx="8" fill="currentColor" fill-opacity="0.05" stroke="#3f73c4" stroke-width="1.5"/><text x="500.0" y="98" font-size="13" fill="var(--ink,#1a202c)" text-anchor="middle" font-weight="700">match</text><text x="500.0" y="122" font-size="11" fill="var(--ink-soft,#5a6677)" text-anchor="middle" font-weight="400">50ms a move,</text><text x="500.0" y="138" font-size="11" fill="var(--ink-soft,#5a6677)" text-anchor="middle" font-weight="400">sequential test</text><line x1="560" y1="113" x2="580" y2="113" stroke="var(--ink-soft,#5a6677)" stroke-width="1.6"/><path d="M580 113 L572.8 116.5 L572.8 109.5 Z" fill="var(--ink-soft,#5a6677)"/><rect x="580" y="70" width="120" height="86" rx="8" fill="currentColor" fill-opacity="0.05" stroke="#2a9d8f" stroke-width="1.5"/><text x="640.0" y="98" font-size="13" fill="var(--ink,#1a202c)" text-anchor="middle" font-weight="700">verdict</text><text x="640.0" y="122" font-size="11" fill="var(--ink-soft,#5a6677)" text-anchor="middle" font-weight="400">better, or no loss</text><text x="640.0" y="138" font-size="11" fill="var(--ink-soft,#5a6677)" text-anchor="middle" font-weight="400">and fewer nodes</text><text x="360" y="196" font-size="12" fill="var(--ink,#1a202c)" text-anchor="middle" font-weight="400">A change that misses a puzzle, or loses the match, is dropped and its numbers are recorded.</text></svg>
