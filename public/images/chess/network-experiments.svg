"400">16 output layers</text><line x1="589.2" y1="284" x2="670.4" y2="284" stroke="var(--ink-soft,#5a6677)" stroke-width="7" stroke-linecap="round" opacity="0.35"/><circle cx="628.3" cy="284" r="5" fill="var(--ink-soft,#5a6677)"/><text x="680.4" y="288" font-size="11" fill="var(--ink-soft,#5a6677)" text-anchor="start" font-weight="600">+96</text><text x="276" y="312" font-size="12" fill="var(--ink,#1a202c)" text-anchor="end" font-weight="400">8 king buckets</text><line x1="550.1" y1="308" x2="628.3" y2="308" stroke="var(--ink-soft,#5a6677)" stroke-width="7" stroke-linecap="round" opacity="0.35"/><circle cx="588.2" cy="308" r="5" fill="var(--ink-soft,#5a6677)"/><text x="638.3" y="312" font-size="11" fill="var(--ink-soft,#5a6677)" text-anchor="start" font-weight="600">+55</text><text x="276" y="336" font-size="12" fill="var(--ink,#1a202c)" text-anchor="end" font-weight="400">Mirror only</text><line x1="581.4" y1="332" x2="660.6" y2="332" stroke="var(--ink-soft,#5a6677)" stroke-width="7" stroke-linecap="round" opacity="0.35"/><circle cx="620.5" cy="332" r="5" fill="var(--ink-soft,#5a6677)"/><text x="670.6" y="336" font-size="11" fill="var(--ink-soft,#5a6677)" text-anchor="start" font-weight="600">+88</text><text x="276" y="360" font-size="12" fill="var(--ink,#1a202c)" text-anchor="end" font-weight="400">Mirror and half of the board</text><line x1="616.6" y1="356" x2="666.4" y2="356" stroke="#e44c65" stroke-width="7" stroke-linecap="round" opacity="0.35"/><circle cx="641" cy="356" r="5" fill="#e44c65"/><text x="676.4" y="360" font-size="11" fill="#e44c65" text-anchor="start" font-weight="600">+109</text><text x="20" y="384" font-size="12" fill="var(--ink,#1a202c)" text-anchor="start" font-weight="700">Heavier evaluation</text><text x="276" y="406" font-size="12" fill="var(--ink,#1a202c)" text-anchor="end" font-weight="400">Threat inputs, added to the values</text><line x1="550.1" y1="402" x2="628.3" y2="402" stroke="var(--ink-soft,#5a6677)" stroke-width="7" stroke-linec