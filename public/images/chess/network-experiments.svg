nt-weight="400">+100</text><line x1="681.1" y1="50" x2="681.1" y2="576" stroke="var(--rule,#cbd5e0)" opacity="0.6"/><text x="681.1" y="592" font-size="10" fill="var(--ink-soft,#5a6677)" text-anchor="middle" font-weight="400">+150</text><line x1="730" y1="50" x2="730" y2="576" stroke="var(--rule,#cbd5e0)" opacity="0.6"/><text x="730" y="592" font-size="10" fill="var(--ink-soft,#5a6677)" text-anchor="middle" font-weight="400">+200</text><line x1="534.4" y1="50" x2="534.4" y2="576" stroke="var(--ink-soft,#5a6677)" stroke-dasharray="4 4"/><text x="20" y="76" font-size="12" fill="var(--ink,#1a202c)" text-anchor="start" font-weight="700">Training data</text><text x="276" y="98" font-size="12" fill="var(--ink,#1a202c)" text-anchor="end" font-weight="400">Leela positions only (5.9M)</text><line x1="314.4" y1="94" x2="397.6" y2="94" stroke="var(--ink-soft,#5a6677)" stroke-width="7" stroke-linecap="round" opacity="0.35"/><circle cx="358.4" cy="94" r="5" fill="var(--ink-soft,#5a6677)"/><text x="407.6" y="98" font-size="11" fill="var(--ink-soft,#5a6677)" text-anchor="start" font-weight="600">-180</text><text x="276" y="122" font-size="12" fill="var(--ink,#1a202c)" text-anchor="end" font-weight="400">Leela and self-play (38.7M)</text><line x1="554" y1="118" x2="623.4" y2="118" stroke="var(--ink-soft,#5a6677)" stroke-width="7" stroke-linecap="round" opacity="0.35"/><circle cx="588.2" cy="118" r="5" fill="var(--ink-soft,#5a6677)"/><text x="633.4" y="122" font-size="11" fill="var(--ink-soft,#5a6677)" text-anchor="start" font-weight="600">+55</text><text x="276" y="146" font-size="12" fill="var(--ink,#1a202c)" text-anchor="end" font-weight="400">Twice the Leela positions (55.7M)</text><line x1="562.8" y1="142" x2="636.1" y2="142" stroke="var(--ink-soft,#5a6677)" stroke-width="7" stroke-linecap="round" opacity="0.35"/><circle cx="599" cy="142" r="5" fill="var(--ink-soft,#5a6677)"/><text x="646.1" y="146" font-size="11" fill="var(--ink-soft,#5a6677)" text-anchor="start" font-weight="6