<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="system-ui, -apple-system, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="13"><text x="360" y="26" font-size="15" fill="var(--ink,#1a202c)" text-anchor="middle" font-weight="700">The engine before and after</text><text x="20" y="58" font-size="13" fill="var(--ink-soft,#5a6677)" text-anchor="start" font-weight="600">Before: the engine inside the game</text><rect x="20" y="72" width="326" height="232" rx="8" fill="currentColor" fill-opacity="0.05" stroke="#3f73c4" stroke-width="1.5"/><text x="183.0" y="96" font-size="13" fill="var(--ink,#1a202c)" text-anchor="middle" font-weight="600">GameModes</text><text x="183.0" y="113" font-size="11" fill="var(--ink-soft,#5a6677)" text-anchor="middle" font-weight="400">owns the three parts below and runs the loop</text><rect x="34" y="118" width="138" height="70" rx="8" fill="currentColor" fill-opacity="0.05" stroke="#3f73c4" stroke-width="1.5"/><text x="103.0" y="142" font-size="13" fill="var(--ink,#1a202c)" text-anchor="middle" font-weight="600">GraphicalBoard</text><text x="103.0" y="159" font-size="11" fill="var(--ink-soft,#5a6677)" text-anchor="middle" font-weight="400">the raylib window</text><rect x="34" y="214" width="138" height="70" rx="8" fill="currentColor" fill-opacity="0.05" stroke="#3f73c4" stroke-width="1.5"/><text x="103.0" y="238" font-size="13" fill="var(--ink,#1a202c)" text-anchor="middle" font-weight="600">ChessEngine</text><text x="103.0" y="255" font-size="11" fill="var(--ink-soft,#5a6677)" text-anchor="middle" font-weight="400">search, on its own thread</text><rect x="190" y="118" width="142" height="166" rx="8" fill="currentColor" fill-opacity="0.05" stroke="#3f73c4" stroke-width="1.5"/><text x="261.0" y="142" font-size="13" fill="var(--ink,#1a202c)" text-anchor="middle" font-weight="600">ChessBoard</text><text x="261.0" y="159" font-size="11" fill="var(--ink-soft,#5a6677)" text-anchor="middle" font-weight="400">state, moves and sounds</text><rect x="202" y="176" width="118" height="92" rx="8" fill="currentColor" fill-opacity="0.05" stroke="#3f73c4" stroke-width="1.5"/><text x="261.0" y="198" font-size="13" fill="var(--ink,#1a202c)" text-anchor="middle" font-weight="600">64 ChessPiece</text><text x="261" y="214" font-size="11" fill="var(--ink-soft,#5a6677)" text-anchor="middle" font-weight="400">each a pointer with</text><text x="261" y="229" font-size="11" fill="var(--ink-soft,#5a6677)" text-anchor="middle" font-weight="400">its own texture and</text><text x="261" y="244" font-size="11" fill="var(--ink-soft,#5a6677)" text-anchor="middle" font-weight="400">screen rectangle</text><line x1="172" y1="153" x2="190" y2="153" stroke="#d04a4a" stroke-width="1.6"/><path d="M190.0 153.0 L183.0 156.5 L183.0 149.5 Z" fill="#d04a4a"/><line x1="172" y1="249" x2="190" y2="249" stroke="#d04a4a" stroke-width="1.6"/><path d="M190.0 249.0 L183.0 252.5 L183.0 245.5 Z" fill="#d04a4a"/><text x="183" y="296" font-size="10" fill="#d04a4a" text-anchor="middle" font-weight="400">the window draws the board, the engine searches a copy of it</text><text x="400" y="58" font-size="13" fill="var(--ink-soft,#5a6677)" text-anchor="start" font-weight="600">After: a library and its users</text><rect x="400" y="72" width="300" height="52" rx="8" fill="currentColor" fill-opacity="0.05" stroke="#2a9d8f" stroke-width="1.5"/><text x="550.0" y="96.0" font-size="13" fill="var(--ink,#1a202c)" text-anchor="middle" font-weight="600">Engine library (C++20)</text><text x="550.0" y="113.0" font-size="11" fill="var(--ink-soft,#5a6677)" text-anchor="middle" font-weight="400">bitboards, search, evaluation</text><rect x="400" y="164" width="90" height="52" rx="8" fill="currentColor" fill-opacity="0.05" stroke="#2a9d8f" stroke-width="1.5"/><text x="445.0" y="188.0" font-size="13" fill="var(--ink,#1a202c)" text-anchor="middle" font-weight="600">Tests</text><text x="445.0" y="205.0" font-size="11" fill="var(--ink-soft,#5a6677)" text-anchor="middle" font-weight="400">perft, UCI</text><line x1="445" y1="124" x2="445" y2="164" stroke="#2a9d8f" stroke-width="1.6"/><path d="M445 164 L441.5 156.8 L448.5 156.8 Z" fill="#2a9d8f"/><rect x="505" y="164" width="90" height="52" rx="8" fill="currentColor" fill-opacity="0.05" stroke="#2a9d8f" stroke-width="1.5"/><text x="550.0" y="188.0" font-size="13" fill="var(--ink,#1a202c)" text-anchor="middle" font-weight="600">UCI program</text><text x="550.0" y="205.0" font-size="11" fill="var(--ink-soft,#5a6677)" text-anchor="middle" font-weight="400">GUI or bot</text><line x1="550" y1="124" x2="550" y2="164" stroke="#2a9d8f" stroke-width="1.6"/><path d="M550 164 L546.5 156.8 L553.5 156.8 Z" fill="#2a9d8f"/><rect x="610" y="164" width="90" height="52" rx="8" fill="currentColor" fill-opacity="0.05" stroke="#2a9d8f" stroke-width="1.5"/><text x="655.0" y="188.0" font-size="13" fill="var(--ink,#1a202c)" text-anchor="middle" font-weight="600">HTTP server</text><text x="655.0" y="205.0" font-size="11" fill="var(--ink-soft,#5a6677)" text-anchor="middle" font-weight="400">/move, /health</text><line x1="655" y1="124" x2="655" y2="164" stroke="#2a9d8f" stroke-width="1.6"/><path d="M655 164 L651.5 156.8 L658.5 156.8 Z" fill="#2a9d8f"/><rect x="610" y="252" width="90" height="52" rx="8" fill="currentColor" fill-opacity="0.05" stroke="#2a9d8f" stroke-width="1.5"/><text x="655.0" y="276.0" font-size="13" fill="var(--ink,#1a202c)" text-anchor="middle" font-weight="600">Web board</text><text x="655.0" y="293.0" font-size="11" fill="var(--ink-soft,#5a6677)" text-anchor="middle" font-weight="400">React package</text><line x1="655" y1="216" x2="655" y2="252" stroke="#2a9d8f" stroke-width="1.6"/><path d="M655 252 L651.5 244.8 L658.5 244.8 Z" fill="#2a9d8f"/><path d="M655 216 L658.5 223.2 L651.5 223.2 Z" fill="#2a9d8f"/></svg>
