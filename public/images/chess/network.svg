<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" height="230" font-family="system-ui, -apple-system, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="13"><text x="360" y="26" font-size="15" fill="var(--ink,#1a202c)" text-anchor="middle" font-weight="700">The network of the evaluation</text><rect x="20" y="70" width="120" height="86" rx="8" fill="currentColor" fill-opacity="0.05" stroke="#3f73c4" stroke-width="1.5"/><text x="80" y="98" font-size="13" fill="var(--ink,#1a202c)" text-anchor="middle" font-weight="700">a position</text><text x="80" y="122" font-size="11" fill="var(--ink-soft,#5a6677)" text-anchor="middle" font-weight="400">up to 32 pieces</text><text x="80" y="138" font-size="11" fill="var(--ink-soft,#5a6677)" text-anchor="middle" font-weight="400">on 64 squares</text><line x1="140" y1="113" x2="160" y2="113" stroke="var(--ink-soft,#5a6677)" stroke-width="1.6"/><path d="M160 113 L152.8 116.5 L152.8 109.5 Z" fill="var(--ink-soft,#5a6677)"/><rect x="160" y="70" width="120" height="86" rx="8" fill="currentColor" fill-opacity="0.05" stroke="#3f73c4" stroke-width="1.5"/><text x="220" y="98" font-size="13" fill="var(--ink,#1a202c)" text-anchor="middle" font-weight="700">inputs</text><text x="220" y="122" font-size="11" fill="var(--ink-soft,#5a6677)" text-anchor="middle" font-weight="400">768 for each half</text><text x="220" y="138" font-size="11" fill="var(--ink-soft,#5a6677)" text-anchor="middle" font-weight="400">that holds the king</text><line x1="280" y1="113" x2="300" y2="113" stroke="var(--ink-soft,#5a6677)" stroke-width="1.6"/><path d="M300 113 L292.8 116.5 L292.8 109.5 Z" fill="var(--ink-soft,#5a6677)"/><rect x="300" y="70" width="120" height="86" rx="8" fill="currentColor" fill-opacity="0.05" stroke="#3f73c4" stroke-width="1.5"/><text x="360" y="98" font-size="13" fill="var(--ink,#1a202c)" text-anchor="middle" font-weight="700">first layer</text><text x="360" y="122" font-size="11" fill="var(--ink-soft,#5a6677)" text-anchor="middle" font-weight="400">a sum of a few rows,</text><text x="360" y="138" font-size="11" fill="var(--ink-soft,#5a6677)" text-anchor="middle" font-weight="400">128 values a side</text><line x1="420" y1="113" x2="440" y2="113" stroke="var(--ink-soft,#5a6677)" stroke-width="1.6"/><path d="M440 113 L432.8 116.5 L432.8 109.5 Z" fill="var(--ink-soft,#5a6677)"/><rect x="440" y="70" width="120" height="86" rx="8" fill="currentColor" fill-opacity="0.05" stroke="#3f73c4" stroke-width="1.5"/><text x="500" y="98" font-size="13" fill="var(--ink,#1a202c)" text-anchor="middle" font-weight="700">output layer</text><text x="500" y="122" font-size="11" fill="var(--ink-soft,#5a6677)" text-anchor="middle" font-weight="400">one of 8, chosen by</text><text x="500" y="138" font-size="11" fill="var(--ink-soft,#5a6677)" text-anchor="middle" font-weight="400">the number of pieces</text><line x1="560" y1="113" x2="580" y2="113" stroke="var(--ink-soft,#5a6677)" stroke-width="1.6"/><path d="M580 113 L572.8 116.5 L572.8 109.5 Z" fill="var(--ink-soft,#5a6677)"/><rect x="580" y="70" width="120" height="86" rx="8" fill="currentColor" fill-opacity="0.05" stroke="#2a9d8f" stroke-width="1.5"/><text x="640" y="98" font-size="13" fill="var(--ink,#1a202c)" text-anchor="middle" font-weight="700">score</text><text x="640" y="122" font-size="11" fill="var(--ink-soft,#5a6677)" text-anchor="middle" font-weight="400">centipawns for the</text><text x="640" y="138" font-size="11" fill="var(--ink-soft,#5a6677)" text-anchor="middle" font-weight="400">side to move</text><text x="360" y="190" font-size="12" fill="var(--ink,#1a202c)" text-anchor="middle" font-weight="400">A move takes a row out of the sum and puts another in.</text><text x="360" y="210" font-size="12" fill="var(--ink,#1a202c)" text-anchor="middle" font-weight="400">A king that crosses to the other half makes its side compute the sum again.</text></svg>